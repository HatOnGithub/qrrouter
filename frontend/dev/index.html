<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QR Router — local Dolibarr mock</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      document.documentElement.dataset.mockTheme =
        localStorage.getItem('qrr-mock-theme') || 'light';
    </script>
  </head>
  <body>
    <header class="mock-topbar">
      <strong>Dolibarr</strong>
      <span>Products / Stock / QR Router</span>
      <b>LOCAL MOCK</b>
      <button
        type="button"
        id="mock-camera-toggle"
        aria-controls="mock-camera-panel"
        aria-expanded="false"
      >
        Camera mock
      </button>
    </header>
    <form class="mock-controls" id="mock-controls">
      <label>
        Scenario
        <select name="scenario" aria-label="Mock scenario">
          <option value="populated">Sample inventory</option>
          <option value="empty">Empty inventory / no employees</option>
          <option value="no-employees">Sample inventory / no employees</option>
          <option value="read-only">Read-only operator</option>
          <option value="pending">Pending synchronization</option>
          <option value="unavailable">Service unavailable</option>
        </select>
      </label>
      <label>
        Language
        <select name="locale" aria-label="Mock language">
          <option value="en_US">English</option>
          <option value="nl_NL">Nederlands</option>
          <option value="fr_FR">Français</option>
        </select>
      </label>
      <label>
        Delay
        <select name="latency" aria-label="Mock response delay">
          <option value="0">None</option>
          <option value="250">250 ms</option>
          <option value="1000">1 second</option>
        </select>
      </label>
      <label>
        Theme
        <select name="theme" aria-label="Mock theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button type="submit">Reset and apply</button>
      <span>In-memory sample data. No real Dolibarr connection.</span>
      <span id="mock-error" role="status"></span>
    </form>
    <div class="mock-workspace">
      <main class="mock-main">
        <qrr-root data-api="/custom/qrrouter/api.php"></qrr-root>
      </main>
      <aside
        class="mock-camera-panel"
        id="mock-camera-panel"
        aria-labelledby="mock-camera-heading"
        tabindex="-1"
        hidden
      >
        <header class="mock-camera-header">
          <h2 id="mock-camera-heading">Camera mock</h2>
          <button type="button" id="mock-camera-close">Close camera controls</button>
        </header>
        <div class="mock-camera-body">
          <p>
            A virtual camera for local development. No connected camera or browser permission is
            needed.
          </p>
          <label for="mock-camera-mode">Camera source</label>
          <select id="mock-camera-mode">
            <option value="virtual">Virtual camera</option>
            <option value="denied">Permission denied</option>
            <option value="unavailable">Camera unavailable</option>
            <option value="real">Real camera</option>
          </select>
          <p class="mock-camera-hint">
            After changing the source, use Start camera or Restart camera in the scanner.
          </p>
          <canvas
            id="mock-camera-preview"
            width="640"
            height="480"
            role="img"
            aria-label="Virtual camera preview"
          ></canvas>
          <p id="mock-camera-status" role="status"></p>
          <form id="mock-camera-qr-form" class="mock-camera-form">
            <label for="mock-camera-fixture">Fixture QR code</label>
            <div class="mock-camera-row">
              <select id="mock-camera-fixture">
                <option value="">Choose an inventory label</option>
              </select>
              <button type="button" id="mock-camera-refresh">Refresh labels</button>
            </div>
            <label for="mock-camera-content">QR content</label>
            <textarea
              id="mock-camera-content"
              rows="2"
              maxlength="1024"
              placeholder="Choose a fixture or paste an identifier / QR URL"
            ></textarea>
            <div class="mock-camera-row">
              <button type="submit" id="mock-camera-show">Show QR code</button>
              <button type="button" id="mock-camera-clear">Clear frame</button>
            </div>
          </form>
          <label for="mock-camera-format">Camera format</label>
          <select id="mock-camera-format">
            <option value="640x480">Landscape 4:3</option>
            <option value="480x640">Portrait 3:4</option>
            <option value="960x540">Wide 16:9</option>
          </select>
          <label for="mock-camera-zoom">
            QR size
            <output for="mock-camera-zoom" id="mock-camera-zoom-value">45%</output>
          </label>
          <input id="mock-camera-zoom" type="range" min="15" max="75" step="5" value="45" />
          <label for="mock-camera-rotation">
            Rotation
            <output for="mock-camera-rotation" id="mock-camera-rotation-value">0°</output>
          </label>
          <input id="mock-camera-rotation" type="range" min="-180" max="180" step="15" value="0" />
          <p id="mock-camera-error" role="alert" hidden></p>
        </div>
      </aside>
    </div>
    <script defer src="/mock/controls.js"></script>
    <script defer src="/mock/camera-mock.js"></script>
  </body>
</html>
