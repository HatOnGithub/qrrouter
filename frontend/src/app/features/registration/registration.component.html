<section class="scanner-page">
  <h1>{{ 'Register items' | t }}</h1>
  @if (api.context()!.permissions.manage) {
    <qrr-card class="capture-card" [title]="'Select labels' | t">
      <qrr-capture
        [initial]="codes()"
        (changed)="codes.set($event); thumbnail = ''"
        (thumbnail)="thumbnail = $event"
      />
      <button
        action
        class="scanner-primary"
        mat-flat-button
        [disabled]="!codes().length"
        (click)="continue()"
      >
        <fa-icon [icon]="continueIcon" aria-hidden="true" />
        {{ 'Assign details' | t }}
      </button>
    </qrr-card>
  } @else {
    <p class="alert">{{ 'QR management permission required' | t }}</p>
  }
</section>
