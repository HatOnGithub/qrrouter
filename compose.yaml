services:
  qrrouter-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qrrouter-api:0.3.7.1
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AppSettings__ApiKey: ${QRR_SERVICE_API_KEY:?Set QRR_SERVICE_API_KEY in .env}
      AppSettings__DataDirectory: /data
    ports:
      - '127.0.0.1:${QRR_PORT:-5087}:8080'
    volumes:
      - qrrouter-data:/data
    networks:
      - qrrouter
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  qrrouter-data:

networks:
  qrrouter:
